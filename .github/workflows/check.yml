name: Check magazine system
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MAGAZINE_ISSUES_DIR: ${{ github.workspace }}/publication/issues
      MAGAZINE_PUBLISHED_URL: https://longxy4.github.io/kansai-magazine/
    steps:
      - uses: actions/checkout@v4
        with:
          path: system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Longxy4/kansai-magazine
          ref: main
          path: publication
          persist-credentials: false
      - name: Restore converted magazine pages
        uses: actions/cache@v5
        with:
          path: system/.build
          key: magazine-v2-${{ runner.os }}-${{ hashFiles('system/scripts/**', 'system/vendor/**', 'publication/issues/*.pdf', 'publication/issues/*.PDF') }}
          restore-keys: |
            magazine-v2-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check reader controls and issue links
        working-directory: system
        run: node --test tests/*.test.mjs
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -r system/scripts/requirements.txt
      - name: Check actual publication links and QR codes
        working-directory: system
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build actual publication without deploying
        working-directory: system
        run: |
          python scripts/render-issues.py
          node scripts/build-site.mjs
      - name: Report per-file publication results
        if: always()
        working-directory: system
        run: python scripts/publish-summary.py
