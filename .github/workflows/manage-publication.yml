name: Upload and publish magazines
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: system repository release containing PDF attachments'
        required: false
        type: string
      publish:
        description: 'Write PDFs and ebooks to the reader repository (disable for a build check)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: manage-reader-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MAGAZINE_ISSUES_DIR: ${{ github.workspace }}/system/.build/source-issues
      MAGAZINE_PUBLISHED_URL: https://longxy4.github.io/kansai-magazine/
      SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - name: Check cross-repository authorization
        env:
          PUBLICATION_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
        run: |
          if [ "$SHOULD_PUBLISH" = true ] && [ -z "$PUBLICATION_TOKEN" ]; then
            echo '::error::Add PUBLICATION_TOKEN to system repository Actions secrets before publishing.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          path: system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Longxy4/kansai-magazine
          ref: main
          path: publication
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: system/.build/objects
          key: managed-magazine-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: managed-magazine-v1-${{ runner.os }}-
      - name: Download PDFs uploaded to a system release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RELEASE: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p system/.incoming
          if [ -n "$UPLOAD_RELEASE" ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.pdf' --pattern '*.PDF' --dir system/.incoming -- "$UPLOAD_RELEASE"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -r system/scripts/requirements.txt
      - name: Prepare uploaded PDFs without changing reader files
        run: python system/scripts/manage-publication.py prepare --publication publication --incoming system/.incoming --combined system/.build/source-issues
      - name: Check system
        working-directory: system
        env:
          MAGAZINE_ISSUES_DIR: ${{ github.workspace }}/publication/issues
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build all readers
        working-directory: system
        run: |
          python scripts/render-issues.py
          node scripts/build-site.mjs
      - name: Collect verified PDFs and reader links
        run: python system/scripts/manage-publication.py collect --publication publication --incoming system/.incoming --combined system/.build/source-issues --site system/_site
      - name: Report each PDF
        if: always()
        working-directory: system
        run: python scripts/publish-summary.py
      - name: Save verified publication for inspection
        uses: actions/upload-artifact@v4
        with:
          name: reader-publication
          path: system/_site
          include-hidden-files: true
          retention-days: 3
      - name: Save verified PDFs and links to reader main
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
        working-directory: publication
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- issues README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified magazine PDFs and reading links'
            git push origin HEAD:main
          fi
      - name: Publish ebooks to reader gh-pages branch
        if: env.SHOULD_PUBLISH == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PUBLICATION_TOKEN }}
          external_repository: Longxy4/kansai-magazine
          publish_branch: gh-pages
          publish_dir: system/_site
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish verified magazine readers'
