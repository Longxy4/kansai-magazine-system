<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>関西通信</title><body><p id="status">読み込み中…</p><script>
const aliases=__ISSUE_ALIASES__;
const requested=new URLSearchParams(location.search).get('issue')||'__LATEST_ISSUE__';
const key=requested.normalize('NFKC').replace(/\s+/g,'').replace(/\.pdf$/i,'');
const issue=Object.hasOwn(aliases,key)?aliases[key]:null;
if(issue)location.replace('./read/'+issue+'/'+location.hash);
else document.getElementById('status').textContent='指定された号が見つかりません。リンクをご確認ください。';
</script><noscript>雑誌の閲覧には JavaScript を有効にしてください。</noscript></body></html>
